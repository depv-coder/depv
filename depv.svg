<svg xmlns="http://www.w3.org/2000/svg" width="440" height="72" viewBox="0 0 440 72" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="1.35" fill="#fff"/>
    </pattern>
    <mask id="textDots" maskUnits="userSpaceOnUse" x="0" y="0" width="440" height="72">
      <text x="8" y="50" textLength="424" lengthAdjust="spacingAndGlyphs"
            font-family="'SF Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace"
            font-size="44" font-weight="900"
            fill="url(#dots)" stroke="url(#dots)" stroke-width="2">depv.netlify.app</text>
    </mask>
    <linearGradient id="stripe" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="40" spreadMethod="repeat">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="0.38" stop-color="#3b4048"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#3b4048"/>
      <stop offset="1" stop-color="#3b4048"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="200 40" dur="2.4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="440" height="72" fill="url(#stripe)" mask="url(#textDots)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
